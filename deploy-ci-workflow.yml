name: CI/CD Production Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        run: |
          cd smartpark-backend
          chmod +x mvnw
          ./mvnw clean test

      - name: Build Backend Docker Image
        run: |
          docker build -t smartpark-backend:${{ github.sha }} ./smartpark-backend

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smartpark-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd smartpark-frontend
          npm ci

      - name: Compile & Build Frontend
        run: |
          cd smartpark-frontend
          npm run build
        env:
          VITE_API_BASE_URL: https://smartpark-backend-production.a.run.app/api
          VITE_WS_URL: https://smartpark-backend-production.a.run.app/ws

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://smartpark-backend-production.a.run.app/api \
            --build-arg VITE_WS_URL=https://smartpark-backend-production.a.run.app/ws \
            -t smartpark-frontend:${{ github.sha }} ./smartpark-frontend

  deploy:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Google Cloud Authentication
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker --quiet

      - name: Push Backend Docker Image to GCR
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartpark-backend:${{ github.sha }} ./smartpark-backend
          docker tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartpark-backend:${{ github.sha }} gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartpark-backend:latest
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartpark-backend:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartpark-backend:latest

      - name: Deploy Backend to Google Cloud Run
        run: |
          gcloud run deploy smartpark-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/smartpark-backend:${{ github.sha }} \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,DB_URL=${{ secrets.DB_URL }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }},ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}"

      # Vercel Deployment
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: ./smartpark-frontend
