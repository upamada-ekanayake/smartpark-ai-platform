# Production Environment Configuration

# Server configurations (Cloud Run binds dynamically via PORT env variable)
server.port=${PORT:8080}

# Production Neon PostgreSQL Database Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool settings optimized for Neon
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate Production Safety Policies
# Use 'validate' in production to prevent schema overrides, requiring migration scripts
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Credentials
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# API Documentation Policy (disable Swagger UI in production for security, or keep if requested)
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}

# Production CORS Mappings
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
